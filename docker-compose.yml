services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ist
      POSTGRES_USER: ist
      POSTGRES_PASSWORD: ist-local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ist -d ist"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ist-postgres:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ist
      MINIO_ROOT_PASSWORD: ist-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ist-minio:/data

  minio-setup:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ist ist-local-secret;
      mc mb --ignore-existing local/ist-media;
      mc anonymous set download local/ist-media;
      "

volumes:
  ist-postgres:
  ist-minio:
